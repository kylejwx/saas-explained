<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Azure v1 SaaS reference architecture</title>
  <desc id="description">A customer browser connects to Microsoft Entra External ID and an Azure App Service web application. App Service uses PostgreSQL, Blob Storage, Key Vault through managed identity, and Application Insights with Azure Monitor. GitHub, a coding agent, Azure Agent Skills and MCP, plus azd, Bicep, and GitHub Actions form the development and deployment path.</desc>
  <style>
    :root { color-scheme: light dark; }
    .canvas { fill: #f8fafc; }
    .group { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
    .node { fill: #ffffff; stroke: #2563eb; stroke-width: 2; }
    .azure { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
    .identity { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
    .tooling { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .label { fill: #0f172a; font: 600 18px system-ui, sans-serif; text-anchor: middle; }
    .small { fill: #334155; font: 14px system-ui, sans-serif; text-anchor: middle; }
    .group-label { fill: #1e3a8a; font: 700 16px system-ui, sans-serif; }
    .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 7 6; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0f172a; }
      .group { fill: #172554; stroke: #60a5fa; }
      .node { fill: #1e293b; stroke: #60a5fa; }
      .azure { fill: #0c4a6e; stroke: #38bdf8; }
      .identity { fill: #3b0764; stroke: #c084fc; }
      .tooling { fill: #064e3b; stroke: #34d399; }
      .label { fill: #f8fafc; }
      .small { fill: #cbd5e1; }
      .group-label { fill: #bfdbfe; }
      .arrow { stroke: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="760" rx="20"/>
  <rect class="group" x="36" y="42" width="1128" height="248" rx="16"/>
  <text class="group-label" x="62" y="72">Production Azure stack</text>
  <rect class="node" x="76" y="112" width="185" height="78" rx="12"/>
  <text class="label" x="168" y="145">Customer browser</text>
  <text class="small" x="168" y="169">uses the SaaS</text>
  <rect class="identity" x="324" y="112" width="210" height="78" rx="12"/>
  <text class="label" x="429" y="145">Entra External ID</text>
  <text class="small" x="429" y="169">customer identity</text>
  <rect class="azure" x="610" y="104" width="230" height="94" rx="12"/>
  <text class="label" x="725" y="142">Azure App Service</text>
  <text class="small" x="725" y="168">web application + API</text>
  <rect class="azure" x="914" y="88" width="196" height="58" rx="12"/>
  <text class="label" x="1012" y="122">PostgreSQL</text>
  <rect class="azure" x="914" y="158" width="196" height="58" rx="12"/>
  <text class="label" x="1012" y="192">Blob Storage</text>
  <rect class="azure" x="610" y="222" width="230" height="46" rx="12"/>
  <text class="label" x="725" y="252">Application Insights + Monitor</text>
  <rect class="identity" x="324" y="222" width="210" height="46" rx="12"/>
  <text class="label" x="429" y="252">Managed identity + Key Vault</text>
  <path class="arrow" d="M261 151 H324"/>
  <path class="arrow" d="M261 151 H610"/>
  <path class="arrow" d="M534 151 H610"/>
  <path class="arrow" d="M840 132 H914"/>
  <path class="arrow" d="M840 170 H914"/>
  <path class="arrow" d="M725 198 V222"/>
  <path class="arrow" d="M534 245 H610"/>
  <rect class="group" x="36" y="330" width="1128" height="384" rx="16"/>
  <text class="group-label" x="62" y="360">Development and deployment path</text>
  <rect class="tooling" x="78" y="406" width="180" height="76" rx="12"/>
  <text class="label" x="168" y="438">GitHub repository</text>
  <text class="small" x="168" y="461">source of truth</text>
  <rect class="tooling" x="328" y="394" width="230" height="100" rx="12"/>
  <text class="label" x="443" y="426">Coding agent</text>
  <text class="small" x="443" y="451">Copilot, Claude, Codex,</text>
  <text class="small" x="443" y="471">Cursor, or another choice</text>
  <rect class="tooling" x="628" y="394" width="230" height="100" rx="12"/>
  <text class="label" x="743" y="426">Azure Agent Skills</text>
  <text class="small" x="743" y="451">and Azure MCP Server</text>
  <rect class="tooling" x="928" y="394" width="186" height="100" rx="12"/>
  <text class="label" x="1021" y="426">Deployment</text>
  <text class="small" x="1021" y="451">azd + Bicep</text>
  <text class="small" x="1021" y="471">+ GitHub Actions</text>
  <path class="arrow" d="M258 444 H328"/>
  <path class="arrow" d="M558 444 H628"/>
  <path class="arrow" d="M858 444 H928"/>
  <path class="arrow dashed" d="M1021 494 V590 H725 V290"/>
  <text class="small" x="875" y="577">provisions and deploys</text>
</svg>
